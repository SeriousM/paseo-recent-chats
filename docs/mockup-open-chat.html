<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recent Chats: marking the open chat (mockup)</title>
<style>
  body { margin: 0; padding: 24px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f1115; color: #e6e8eb; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { color: #8b929c; max-width: 80ch; margin: 0 0 12px; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; }
  .controls button { background: #1c1f25; color: #e6e8eb; border: 1px solid #2c313a; border-radius: 8px; padding: 5px 12px; font: inherit; cursor: pointer; }
  .controls button.on { background: #252931; border-color: #4f8cff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 20px; }
  .card h2 { font-size: 14px; margin: 0 0 2px; }
  .card p { font-size: 12px; color: #8b929c; margin: 0 0 8px; min-height: 32px; }

  .panel { border-radius: 12px; padding: 8px 4px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  .dark { --bg: #16181d; --s1: #1c1f25; --s2: #252931; --fg: #e6e8eb; --muted: #8b929c; --border: #2c313a; --accent: #4f8cff;
          --asking: #db932e; --failed: #f7796d; --running: #5caaf6; --ready: #35c264; }
  .light { --bg: #ffffff; --s1: #f4f4f5; --s2: #e9e9ec; --fg: #18181b; --muted: #71717a; --border: #e4e4e7; --accent: #2563eb;
           --asking: #b37824; --failed: #f12e2f; --running: #268ae0; --ready: #299f51; }

  .strip { margin: 0 4px 8px; padding: 4px 0; border-radius: 10px; border: 1px solid var(--asking); background: var(--s1); }
  .heading { font-size: 10.5px; letter-spacing: .7px; text-transform: uppercase; font-weight: 600; color: var(--muted); padding: 2px 10px 4px; }
  .node { font-size: 13px; padding: 3px 10px; display: flex; align-items: center; gap: 6px; }
  .node.project { font-weight: 650; }
  .node.ws { padding-left: 22px; }
  .chats { padding-left: 24px; }

  .row { position: relative; display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 2px 6px 2px 8px; margin: 1px 4px; border-radius: 8px; border: 1px solid transparent; }
  .title { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 11px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .sym { width: 12px; height: 12px; flex: none; display: grid; place-items: center; }
  .q { color: var(--asking); font-weight: 800; font-size: 13px; line-height: 1; animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
  .ring { position: relative; width: 12px; height: 12px; }
  .ring b { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--running); box-sizing: border-box; }
  .ring b:first-child { opacity: .3; }
  .ring b:nth-child(2) { border-color: transparent; border-top-color: var(--running); animation: spin .9s linear infinite; }
  .ring i { position: absolute; inset: 3px; border-radius: 50%; background: var(--running); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Variants of the open chat */
  .v-border .open { border-color: var(--accent); }
  .v-fill .open { background: var(--s2); }
  .v-tint .open { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .v-bar .open::before { content: ""; position: absolute; left: -4px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--accent); }
  .v-text .open .title { color: var(--accent); font-weight: 650; }
  .v-caret .open::before { content: ""; position: absolute; left: -6px; top: 50%; margin-top: -4px; border: 4px solid transparent; border-left: 5px solid var(--accent); }
  .v-eye .open .badge { display: inline-flex; }
  .badge { display: none; align-items: center; gap: 3px; font-size: 10px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 6px; padding: 0 5px; }
  .v-dim .row:not(.open) .title { color: var(--fg); }
  .v-dim .open { background: var(--s2); }
  .v-dim .open .title { font-weight: 650; }
  .v-dim .open::before { content: ""; position: absolute; left: -4px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--fg); opacity: .6; }
</style>
</head>
<body>
<h1>Marking the open chat</h1>
<p class="lede">The open chat sits inside the Needs you box here, the worst case: its own frame competes with the box's amber frame. Each card shows one idea, with the same open chat in the box and in the tree. Switch dark and light.</p>
<div class="controls"><button data-t="dark" class="on">Dark</button><button data-t="light">Light</button></div>
<div class="grid" id="grid"></div>

<template id="panel">
  <div class="panel">
    <div class="strip">
      <div class="heading">Needs you · 2</div>
      <div class="row open"><span class="sym"><span class="q">?</span></span><span class="title">Asks to run the test suite</span><span class="badge">open</span></div>
      <div class="row"><span class="sym"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.4 4.8 9.2 10 3.4" fill="none" stroke="var(--ready)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="title">Settings screen regrouped</span></div>
    </div>
    <div class="node project">▾ paseo-recent-chats</div>
    <div class="node ws">▾ main</div>
    <div class="chats">
      <div class="row open"><span class="sym"><span class="q">?</span></span><span class="title">Asks to run the test suite</span><span class="badge">open</span></div>
      <div class="row"><span class="sym"><span class="ring"><b></b><b></b><i></i></span></span><span class="title">Refactor the host observer</span><span class="meta">2m</span></div>
      <div class="row"><span class="sym"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.3 6.4 4.8 8.9 9.7 3.6" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="title">Pin the release channel</span><span class="meta">3d</span></div>
    </div>
  </div>
</template>

<script>
  const variants = [
    ["v-border", "Now: accent border", "A full frame in the accent colour. Inside the Needs you box it is a frame inside a frame."],
    ["v-fill", "1. Neutral fill", "The row background one step lighter, no line. Paseo marks its own selected rows like this."],
    ["v-tint", "2. Accent tint", "A faint accent wash behind the row, no line."],
    ["v-bar", "3. Short accent bar", "A rounded 3 px bar in the gutter, inset from the top and bottom. No box."],
    ["v-text", "4. Accent title", "Only the title changes: accent colour and bold. Nothing around the row."],
    ["v-caret", "5. Caret in the gutter", "A small accent triangle left of the row, like a cursor."],
    ["v-eye", "6. \"open\" tag", "A small outlined tag at the end of the row; the row itself stays plain."],
    ["v-dim", "7. Fill, bold and neutral bar", "Neutral fill, bold title and a thin grey bar: marked without any accent colour."],
  ];
  const grid = document.getElementById("grid");
  for (const [cls, title, text] of variants) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h2>${title}</h2><p>${text}</p>`;
    const panel = document.getElementById("panel").content.firstElementChild.cloneNode(true);
    panel.classList.add(cls, "dark");
    card.append(panel);
    grid.append(card);
  }
  document.querySelector(".controls").addEventListener("click", (e) => {
    const t = e.target.dataset.t;
    if (!t) return;
    document.querySelectorAll(".controls button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
    document.querySelectorAll(".panel").forEach((p) => { p.classList.toggle("dark", t === "dark"); p.classList.toggle("light", t === "light"); });
    document.body.style.background = t === "dark" ? "#0f1115" : "#f4f4f5";
    document.body.style.color = t === "dark" ? "#e6e8eb" : "#18181b";
  });
</script>
</body>
</html>
